[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm5keys"
version = "0.1.0"
description = "Turn a rowing workout description into the Concept2 PM5 button-press sequence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Eric Bowman" },
]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ebowman/pm5keys"
Issues = "https://github.com/ebowman/pm5keys/issues"

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["ruff", "build"]

[project.scripts]
pm5keys = "pm5keys.cli:main"
pm5keys-data = "pm5keys.data.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pm5keys = ["*.md"]
"pm5keys.data" = ["dataset_unique.jsonl"]
"pm5keys.llm" = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
